<body>
<nav class="top" id="top" aria-label="Quick links"></nav>
<div class="notice" id="notice" hidden></div>
<header class="head" id="head"></header>
<main id="main"></main>
<footer class="foot">© <span id="fname">CartZen</span>. Payment on delivery. <a href="#about">About</a> · <a href="#adminlogin" id="adminLink">Admin login</a></footer>
<button class="wa" id="waBtn" data-a="wabox" hidden>Chat on WhatsApp</button>
<div class="wabox" id="waBox" hidden></div>
<div class="modal" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgMsg"><div class="mbox"><p id="dlgMsg" style="margin-top:0"></p><div class="row" style="justify-content:flex-end"><button class="chip" id="dlgNo">Keep it</button><button class="chip del" id="dlgYes">Yes, continue</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(cfg().currency||'$')+Number(n).toFixed(2);
const STATUSES=['Pending','Processing','Shipped','Delivered','Cancelled'];
const EMO={Men:'👕',Women:'👗',Accessories:'👜'};
const seed=()=>({adminEmail:'admin@eflyer.com',adminHash:null,wa:'',nextP:7,nextO:1001,orders:[],products:[
 {id:1,name:'Men T-shirt',cat:'Men',price:30,stock:24},{id:2,name:'Men shirt',cat:'Men',price:30,stock:18},
 {id:3,name:'Women scarf',cat:'Women',price:30,stock:30},{id:4,name:'Summer dress',cat:'Women',price:48,stock:12},
 {id:5,name:'Leather clutch',cat:'Accessories',price:55,stock:8},{id:6,name:'Gold bracelet',cat:'Accessories',price:22,stock:15}]});
let S=seed(),dbDoc=null,cart={},adminOK=false,tab='dash',cat='All',q='',lastOrder=null,msg='',editId=null,detailId=null,detailColor='',detailMain=true,slideIdx=0,trackQ=null,heroIdx=0,heroHold=false,heroPause=false,coll=null,ordFilter='All',ordQ='',prodQ='',chartRange='m6';

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('show'),2200)}
async function save(){
  try{ if(dbDoc) await dbDoc.set({json:JSON.stringify(S)}); else localStorage.setItem('eflyer-state',JSON.stringify(S)); }
  catch(e){ toast('Could not save to the shop. If you added photos, try smaller ones.'); return false }
  return true
}
const view=()=>{const h=location.hash.slice(1);return ['shop','cart','track','adminlogin','admin','product','thankyou','help','about','login','register','account'].includes(h)?h:'shop'};
const go=v=>{location.hash=v};

function render(){
  let v=view(); if(v==='admin'&&!adminOK) v='adminlogin';
  document.body.classList.toggle('adminmode',v==='admin');
  const hero=v==='shop';
  const h=$('#head'); h.className='head'+(hero?' hero':'');
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  h.innerHTML=`<div class="logo" onclick="go('shop')">${esc(cfg().name)}</div><nav class="bar">
    <button class="chip ${v==='shop'&&!coll?'on':''}" data-a="coll" data-v="">Shop</button>
    <a class="chip ${v==='cart'?'on':''}" href="#cart">Cart (${n})</a>
    <a class="chip ${v==='track'?'on':''}" href="#track">Track order</a>
    ${adminOK?`<a class="chip ${v==='admin'?'on':''}" href="#admin">Admin panel</a><button class="chip" data-a="logout">Log out</button>`:cust?`<a class="chip ${v==='account'?'on':''}" href="#account">Hi, ${esc(cust.name.split(' ')[0])}</a><button class="chip" data-a="logout">Log out</button>`:`<a class="chip ${v==='login'||v==='register'?'on':''}" href="#login">Customer login</a><a class="chip ${v==='adminlogin'?'on':''}" href="#adminlogin">Admin login</a>`}</nav>
    ${hero?heroHtml():''}`;

function cartLines(){
  const L=[],used={};
  for(const [k,qty] of Object.entries(cart)){
    const [id,color]=k.split('|'),p=S.products.find(x=>x.id==id); if(!p)continue;
    const c=color?(p.colors||[]).find(x=>x.name===color):null; if(color&&!c)continue;
    const q=Math.min(qty,p.stock-(used[p.id]||0)); if(q<1)continue;
    used[p.id]=(used[p.id]||0)+q; L.push({key:k,p,c,qty:q});
  }
  return L;
}

function heroArt(kind,dk){
  const P=dk?['#2b2b2b','#ffffff','#ea580c']:['#ffffff','#ffd34d','#ff6b9d'],ink=dk?'#2b2b2b':'#ffffff';
  const spark=(x,y,t)=>`<path d="M${x} ${y-t}L${x+t/3} ${y-t/3}L${x+t} ${y}L${x+t/3} ${y+t/3}L${x} ${y+t}L${x-t/3} ${y+t/3}L${x-t} ${y}L${x-t/3} ${y-t/3}Z" fill="${ink}" opacity=".8"/>`;
  const bag=(x,y,w,h,c,r)=>`<g transform="rotate(${r} ${x+w/2} ${y+h})"><path d="M${x+w*.3} ${y} C${x+w*.3} ${y-h*.3} ${x+w*.7} ${y-h*.3} ${x+w*.7} ${y}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${c}"/><rect x="${x}" y="${y+h*.22}" width="${w}" height="6" fill="#000" opacity=".12"/><circle cx="${x+w*.3}" cy="${y+12}" r="4" fill="#000" opacity=".25"/><circle cx="${x+w*.7}" cy="${y+12}" r="4" fill="#000" opacity=".25"/></g>`;
  const base=`<circle cx="470" cy="130" r="150" fill="#fff" opacity=".13"/><circle cx="560" cy="350" r="110" fill="#fff" opacity=".1"/><circle cx="90" cy="330" r="60" fill="#fff" opacity=".08"/>${spark(120,70,16)}${spark(545,60,12)}${spark(80,230,10)}${spark(565,250,14)}<ellipse cx="330" cy="356" rx="210" ry="14" fill="#000" opacity=".15"/>`;
  let art='';
  if(kind==='bags') art=bag(150,175,120,165,P[0],-6)+bag(270,130,140,210,P[1],0)+bag(405,190,115,150,P[2],7);
  if(kind==='gift') art=`<g><rect x="120" y="278" width="96" height="62" rx="6" fill="${P[2]}"/><rect x="112" y="258" width="112" height="28" rx="6" fill="${P[1]}"/><rect x="156" y="258" width="20" height="82" fill="${P[0]}"/></g>
    <rect x="235" y="225" width="180" height="115" rx="8" fill="${P[0]}"/><rect x="220" y="192" width="210" height="42" rx="8" fill="${P[1]}"/><rect x="313" y="192" width="26" height="148" fill="${P[2]}"/>
    <path d="M326 192 C270 120 215 170 326 192Z" fill="${P[2]}"/><path d="M326 192 C382 120 437 170 326 192Z" fill="${P[2]}"/><circle cx="326" cy="192" r="13" fill="${P[2]}"/>`;
  if(kind==='tag') art=`<g transform="rotate(-12 300 220)"><path d="M150 60 C120 110 150 170 205 200" fill="none" stroke="${ink}" stroke-width="5" stroke-linecap="round"/><path d="M210 110 H430 Q450 110 450 130 V310 Q450 330 430 330 H210 L130 220 Z" fill="${dk?'#2b2b2b':'#ffffff'}"/><circle cx="208" cy="220" r="15" fill="#000" opacity=".28"/><text x="335" y="250" text-anchor="middle" font-size="92" font-weight="800" fill="${dk?'#ffd34d':'#db2777'}" font-family="Poppins,Arial,sans-serif">NEW</text></g>`;
  if(kind==='cart') art=`<g transform="translate(70 20)"><path d="M60 90 H110 L160 270 H400 L440 140 H130" fill="none" stroke="${ink}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 150 H430 L398 255 H162 Z" fill="#fff" opacity=".25"/><rect x="190" y="88" width="70" height="62" rx="8" fill="#ffd34d"/><rect x="275" y="66" width="60" height="84" rx="8" fill="#ff6b9d"/><rect x="345" y="100" width="55" height="50" rx="8" fill="#fff"/><circle cx="205" cy="315" r="26" fill="${ink}"/><circle cx="205" cy="315" r="9" fill="#000" opacity=".3"/><circle cx="365" cy="315" r="26" fill="${ink}"/><circle cx="365" cy="315" r="9" fill="#000" opacity=".3"/></g>`;
  return `<svg class="hart" viewBox="0 0 600 400" preserveAspectRatio="xMaxYMid meet" aria-hidden="true" focusable="false">${base}${art}</svg>`;
}
const banners=()=>(S.banners&&S.banners.length)?S.banners:DEF_BANNERS;
function posterSlide(b,i){
  const alt=esc(b.alt||b.title||'Featured offer');
  return `<a class="hslide pst" href="#products" aria-hidden="${i!==heroIdx}" tabindex="${i!==heroIdx?-1:0}" aria-label="${alt}"><img class="pd" src="${esc(b.img)}" alt="${alt}">${b.imgM?`<img class="pm" src="${esc(b.imgM)}" alt="">`:''}</a>`;
}
function brandSlide(b,i){
  return `<div class="hslide brand" aria-hidden="${i!==heroIdx}"><div class="bl"><img class="blg" src="${LOGO}" alt="${esc(cfg().name)}"><h2 class="bh">${esc(b.t1)} <em>${esc(b.t2)}</em></h2><p>${esc(b.sub)}</p><a class="chip bcta" href="${esc(b.href||'#products')}"${i!==heroIdx?' tabindex="-1"':''}>${esc(b.cta||'Shop now')}</a></div><div class="bv"><img src="${BRAND_IMG}" alt="" style="transform:scale(${b.z||1});transform-origin:${b.o||'right center'}"></div></div>`;
}
function heroHtml(){
  const B=banners();if(heroIdx>=B.length)heroIdx=0;
  return `<div class="hs" id="hs" role="region" aria-roledescription="carousel" aria-label="Featured offers"><div class="htrack" id="htrack" style="transform:translateX(-${heroIdx*100}%)">

function goHero(i){
  const n=banners().length;heroIdx=(i+n)%n;
  const t=$('#htrack');if(t)t.style.transform='translateX(-'+heroIdx*100+'%)';
  document.querySelectorAll('.hdot').forEach((d,k)=>d.classList.toggle('on',k===heroIdx));
  document.querySelectorAll('.hslide').forEach((d,k)=>d.setAttribute('aria-hidden',k!==heroIdx));
}
function salesSeries(range){
  const live=S.orders.filter(o=>o.status!=='Cancelled'),now=new Date(),pts=[];
  const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(range==='d30'){
    for(let i=29;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),k=d.toDateString();
      pts.push({label:d.getDate()+' '+names[d.getMonth()],v:live.filter(o=>new Date(o.created).toDateString()===k).reduce((t,o)=>t+o.total,0)})}
  }else{
    const n=range==='m12'?12:6;
    for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      pts.push({label:names[d.getMonth()],v:live.filter(o=>{const c=new Date(o.created);return c.getFullYear()===d.getFullYear()&&c.getMonth()===d.getMonth()}).reduce((t,o)=>t+o.total,0)})}
  }
  return pts;
}
function salesChart(range){
  const pts=salesSeries(range),W=640,H=270,L=52,R=16,T=16,B=36,mx=Math.max(0,...pts.map(p=>p.v))||1000;
  const raw=mx/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),nn=raw/mag,step=(nn<=1?1:nn<=2?2:nn<=5?5:10)*mag,top=step*4;
  const X=i=>L+(pts.length===1?0:i*(W-L-R)/(pts.length-1)),Y=v=>T+(H-T-B)*(1-v/top);
  let d='';pts.forEach((p,i)=>{const x=X(i),y=Y(p.v);if(i===0)d+='M'+x+' '+y;else{const px=X(i-1),py=Y(pts[i-1].v),m=(px+x)/2;d+=' C'+m+' '+py+' '+m+' '+y+' '+x+' '+y}});
  const area=d+' L'+X(pts.length-1)+' '+(H-B)+' L'+X(0)+' '+(H-B)+'Z';
  const grid=[0,1,2,3,4].map(k=>{const v=step*k,y=Y(v);return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v>=1000?+(v/1000).toFixed(1)+'k':+v.toFixed(0)}</text>`}).join('');
  const every=Math.ceil(pts.length/8);
  const xl=pts.map((p,i)=>i%every===0?`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(p.label)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales over time" style="width:100%;height:auto"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c8ee" stop-opacity=".55"/><stop offset="1" stop-color="#22c8ee" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#22c8ee" stroke-width="3" stroke-linecap="round"/>${xl}${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="#22c8ee"><title>${esc(p.label)}: ${money(p.v)}</title></circle>`).join('')}</svg>`;
}
function vDash(){
  const O=S.orders,live=O.filter(o=>o.status!=='Cancelled'),sales=live.reduce((t,o)=>t+o.total,0);
  const rev=O.filter(o=>o.status==='Delivered').reduce((t,o)=>t+o.total,0),pending=O.filter(o=>o.status==='Pending').length;
  const top=S.products.map(p=>({p,n:soldOf(p.id)})).sort((a,b)=>b.n-a.n||a.p.id-b.p.id).slice(0,5);
  const low=S.products.filter(p=>p.stock<=lowLimit()).sort((a,b)=>a.stock-b.stock).slice(0,6);
  const thumb=p=>p.img?`<img src="${esc(p.img)}" alt="">`:`<span aria-hidden="true">${EMO[p.cat]||'🛍️'}</span>`;
  return `<div class="kpis">${[['Total Sales',money(sales)],['Revenue (delivered)',money(rev)],['Orders',O.length],['Pending orders',pending]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
  <div class="dgrid"><div class="dcol">
   <div class="panel"><div class="phead"><h3>Sales</h3><select data-f="crange" aria-label="Chart range"><option value="d30" ${chartRange==='d30'?'selected':''}>Last 30 days</option><option value="m6" ${chartRange==='m6'?'selected':''}>Last 6 months</option><option value="m12" ${chartRange==='m12'?'selected':''}>Last 12 months</option></select></div>${salesChart(chartRange)}${sales?'':'<p class="muted" style="text-align:center">No sales yet. The chart fills in as orders arrive.</p>'}</div>
   <div class="panel"><div class="phead"><h3>Recent Orders</h3><button class="chip" data-a="tab" data-v="ord">View all</button></div>
   ${O.length?`<div class="scroll"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>${O.slice(0,5).map(o=>`<tr><td>#${o.id}</td><td><b>${esc(o.name)}</b></td><td>${money(o.total)}</td><td><span class="pill ${o.status}">${o.status}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No orders yet.</p>'}</div>
  </div><div class="dcol">
   <div class="panel"><div class="phead"><h3>Top products</h3><button class="chip" data-a="tab" data-v="prod">All</button></div>
   ${top.length?top.map(x=>`<div class="pitem"><div class="pth">${thumb(x.p)}</div><div><b>${esc(x.p.name)}</b><div class="muted">${money(x.p.price)} · ${x.n} sold</div></div></div>`).join(''):'<p class="empty">No products yet.</p>'}</div>
   <div class="panel"><div class="phead"><h3>Low stock</h3></div>
   ${low.length?low.map(p=>`<div class="pitem"><div class="pth">${thumb(p)}</div><div style="flex:1"><b>${esc(p.name)}</b><div class="muted">${p.stock} left</div></div><button class="chip" data-a="restock" data-v="${p.id}">Restock</button></div>`).join(''):'<p class="empty">Everything is well stocked.</p>'}</div>
  </div></div>`;
}

function adminShell(inner){
  const items=[['dash','Dashboard','▦'],['ord','Orders','🧾'],['prod','Products','📦'],['cus','Customers','👥'],['ban','Banners','🖼️'],['set','Settings','⚙️']];
  return `<div class="adm"><aside class="side" aria-label="Admin menu">
  <div class="brand"><img class="blogo" src="${LOGO}" alt="${esc(cfg().name)}"></div>
  ${items.map(([k,t,ic])=>`<button class="si ${tab===k?'on':''}" data-a="tab" data-v="${k}" ${tab===k?'aria-current="page"':''}><span aria-hidden="true">${ic}</span>${t}</button>`).join('')}
  <div class="sp"></div>
  <a class="si" href="#shop"><span aria-hidden="true">🛍️</span>View shop</a>
  <button class="si" data-a="logout"><span aria-hidden="true">↪</span>Log out</button></aside>
  <section class="admmain"><div class="adtop"><input id="gq" type="search" placeholder="Search orders by number, name or phone" value="${esc(ordQ)}" aria-label="Search orders"><div class="who"><div class="av" aria-hidden="true">${esc((S.adminEmail||'A')[0].toUpperCase())}</div><div><b>Admin</b><span class="muted">${esc(S.adminEmail||'')}</span></div></div></div>${inner}</section></div>`;
}
function vOrders(nav){
  let L=S.orders;
  if(ordFilter!=='All')L=L.filter(o=>o.status===ordFilter);
  const t=ordQ.trim().toLowerCase();
  if(t)L=L.filter(o=>String(o.id).includes(t)||o.name.toLowerCase().includes(t)||String(o.phone).includes(t));
  return `<h2>Orders</h2>${nav}
  <div class="row" style="margin-bottom:12px"><input id="oq" type="search" placeholder="Search order number, name or phone" value="${esc(ordQ)}" aria-label="Search orders" style="min-width:250px">
  ${['All',...STATUSES].map(st=>`<button class="chip ${ordFilter===st?'on':''}" data-a="ordfilter" data-v="${st}">${st}</button>`).join('')}<button class="chip" data-a="csv">Copy orders as CSV</button></div>
  ${L.length?`<div class="scroll"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${L.map(o=>`<tr><td>#${o.id}<br><span class="muted">${new Date(o.created).toLocaleString()}</span></td>
  <td>${esc(o.name)}<br><span class="muted">${esc(o.phone)} · ${esc(o.addr)}</span>${o.notes?`<br><span class="muted">Note: ${esc(o.notes)}</span>`:''}</td>
  <td>${o.items.map(i=>esc(i.name)+(i.color?' ('+esc(i.color)+')':'')+' ×'+i.qty).join(', ')}</td>
  <td>${money(o.total)}${o.delivery?`<br><span class="muted">incl. ${money(o.delivery)} delivery</span>`:''}</td>
  <td>${o.status==='Cancelled'?'<span class="badge Cancelled">Cancelled</span>':`<select data-f="status" data-v="${o.id}" aria-label="Status of order ${o.id}">${STATUSES.map(st=>`<option ${st===o.status?'selected':''}>${st}</option>`).join('')}</select>`}</td>
  <td class="row"><button class="chip" data-a="msgcust" data-v="${o.id}">Copy message</button>${o.status==='Cancelled'||o.status==='Delivered'?`<button class="chip del" data-a="delord" data-v="${o.id}">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No orders here yet.</p>'}`;
}
function vCustomers(nav){
  const m=new Map();
  S.orders.forEach(o=>{const k=norm(o.phone),c=m.get(k)||{name:o.name,phone:o.phone,n:0,spent:0,last:0};c.name=o.name;c.phone=o.phone;if(o.status!=='Cancelled'){c.n++;c.spent+=o.total}c.last=Math.max(c.last,o.created);m.set(k,c)});
  const L=[...m.values()].sort((a,b)=>b.spent-a.spent);
  return `<h2>Customers</h2>${nav}<p class="muted">Built from the orders your shop received. Customers are matched by phone number.</p>
  ${L.length?`<div class="scroll"><table><thead><tr><th>Name</th><th>Phone</th><th>Orders</th><th>Spent</th><th>Last order</th><th></th></tr></thead><tbody>
  ${L.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.n}</td><td>${money(c.spent)}</td><td>${new Date(c.last).toLocaleDateString()}</td><td><button class="chip" data-a="copyph" data-v="${esc(c.phone)}">Copy phone</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No customers yet. They appear after the first order.</p>'}`;
}
function vSettings(nav){
  const c=cfg();
  return `<h2>Settings</h2>${nav}
  <h3>Store details</h3><form id="cfgForm" class="stack" style="max-width:640px">
  <label>Store name <input name="name" value="${esc(c.name)}" required maxlength="40"></label>
  <label>Currency symbol <input name="currency" value="${esc(c.currency)}" required maxlength="4" style="width:100px"></label>
  <label>Delivery charge (0 = free) <input name="delivery" type="number" min="0" step="0.01" value="${c.delivery}"></label>
  <label>Free delivery on orders over (0 = off) <input name="freeOver" type="number" min="0" step="0.01" value="${c.freeOver}"></label>
  <label>Low stock warning at <input name="lowStock" type="number" min="0" step="1" value="${c.lowStock}"></label>
  <label>Announcement bar (shown at the top of every page, empty to hide) <input name="notice" value="${esc(c.notice)}" maxlength="140"></label>
  <label>Shop address <input name="address" value="${esc(c.address)}" maxlength="200"></label>
  <label>Opening hours <input name="hours" value="${esc(c.hours)}" maxlength="100"></label>
  <button class="btn pri">Save store details</button></form>
  <h3>WhatsApp</h3><form id="waForm" class="stack"><label>Shop WhatsApp number (e.g. 01XXXXXXXXX, starting with 0 is fine) <input name="wa" type="tel" inputmode="numeric" value="${esc(S.wa||'')}" placeholder="01XXXXXXXXX"></label><button class="btn pri">Save WhatsApp number</button><p class="muted" style="margin:0">Customers will message: +${esc(waNum())}</p></form>
  <h3>Admin login</h3>
  <form id="emailForm" class="stack" style="margin-bottom:18px"><label>Admin email <input name="email" type="email" value="${esc(S.adminEmail)}" required></label><input name="cur" type="password" placeholder="Current password" required autocomplete="current-password"><button class="btn pri">Change admin email</button></form>
  <form id="pwForm" class="stack"><input name="cur" type="password" placeholder="Current password" required autocomplete="current-password"><input name="nw" type="password" placeholder="New password (6+ characters)" minlength="6" required autocomplete="new-password"><button class="btn pri">Change password</button></form>
  <p class="muted">This password only locks the admin screens in the page. For strong protection, share the page link only with people you trust.</p>
  <h3>Backup and restore</h3><p class="muted">Copy a backup of all products, orders and settings, and keep it somewhere safe.</p>
  <p><button class="chip" data-a="copybackup">Copy backup</button></p>
  <form id="restoreForm" class="stack"><label>Paste a backup to restore <textarea name="json" rows="4" required></textarea></label><button class="btn">Restore backup</button></form>
  <h3>Danger zone</h3><button class="chip del" data-a="resetdemo">Reset shop to the demo products</button>`;
}
function vBanners(nav){
  const mine=S.banners||[];
  return `<h2>Banners</h2>${nav}<p class="muted">These are the slides at the top of the shop. ${mine.length?'':'You are using the 3 default slides. Add your own and they replace the defaults.'}</p>
  <form id="banForm" class="stack"><label>Headline (for a finished poster this describes the picture) <input name="title" required maxlength="70"></label><label>Short text (optional) <input name="sub" maxlength="120"></label><label>Button text (optional) <input name="cta" maxlength="20" placeholder="Shop now"></label><label>Banner image (optional, wide pictures work best) <input name="img" type="file" accept="image/*"></label><label class="check"><input type="checkbox" name="poster"> This image is a finished poster. Show it as it is, with no text on top.</label><button class="btn pri" id="banBtn">Add banner</button></form>
  ${mine.length?`<div class="scroll" style="margin-top:20px"><table><thead><tr><th></th><th>Headline</th><th></th></tr></thead><tbody>${mine.map(b=>`<tr><td>${b.img?`<img class="mini" style="width:80px;height:44px" src="${esc(b.img)}" alt="">`:''}</td><td>${esc(b.title)}<div class="muted">${esc(b.sub||'')}</div></td><td><button class="chip del" data-a="delban" data-v="${b.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:''}`;
}
function vAbout(){
  const n=waNum(),cats=[...new Set(S.products.map(p=>p.cat))];
  return `<div class="about"><h2>About CartZen</h2>
  <p class="lead">CartZen is an online fashion store. Browse the collection, pick your color, add to your cart and order in a few taps. You pay in cash when your order arrives.</p>
  <div class="grid" style="margin:24px 0">
   <div class="card left"><b>Easy ordering</b><span class="muted">Order with just your name, phone number and address. No account needed.</span></div>
   <div class="card left"><b>Pay on delivery</b><span class="muted">No online payment. You pay when the order is delivered to you.</span></div>
   <div class="card left"><b>Track your order</b><span class="muted">Follow your order from Pending to Delivered with your order number and phone number.</span></div>
   <div class="card left"><b>WhatsApp support</b><span class="muted">Message us about orders, delivery or products.</span></div></div>
  ${cats.length?`<h3>What we sell</h3><p style="max-width:760px">Our shop currently has: ${cats.map(esc).join(', ')}. New products are added by our team regularly, so check Best Sellers and New Releases at the top of the page.</p>`:''}
  <h3>How it works</h3>
  <ol><li>Browse the shop and open a product to see its photos, colors and description.</li><li>Choose your color and add it to your cart.</li><li>Enter your delivery details and place your order.</li><li>Message us on WhatsApp so we can confirm it, then track it any time.</li><li>Pay in cash when your order is delivered.</li></ol>
  <h3>Contact us</h3>
  ${cfg().address?`<p>Address: ${esc(cfg().address)}</p>`:''}${cfg().hours?`<p>Hours: ${esc(cfg().hours)}</p>`:''}${n?`<p>WhatsApp: <b>+${esc(n)}</b></p>`:''}
  <p><a class="btn pri" href="#help">Customer Service</a> <a class="chip" href="#track">Track my order</a></p></div>`;
}
function vHelp(){

function shrink(file,max,qual){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',qual)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
const blobToUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function storeImage(file,big){
  let assets=null; try{assets=window.claude&&claude.use?await claude.use('assets'):null}catch(e){}
  if(assets){try{const b=await shrink(file,big?1400:800,.8);const r=await Promise.race([assets.upload(b),new Promise((_,rej)=>setTimeout(rej,12000))]);return r.url}catch(e){}}
  return blobToUrl(await shrink(file,big?640:320,.6));   // fallback: small image kept inside the shop data
}

  if(a==='coll'){coll=v||null;cat='All';q='';if(view()!=='shop')go('shop');else render();setTimeout(()=>{const t=document.getElementById('products');if(v&&t)t.scrollIntoView({behavior:'smooth'});else window.scrollTo(0,0)},60)}
  if(a==='open'){detailId=+v;{const pp=S.products.find(x=>x.id===detailId);detailColor=pp&&(pp.colors||[])[0]?pp.colors[0].name:'';slideIdx=0}window.scrollTo(0,0);if(view()==='product')render();else go('product')}
  if(a==='pickcolor'){detailColor=v;const pp=S.products.find(x=>x.id===detailId),k=pp?slidesOf(pp).findIndex(z=>z.color===v):-1;if(k>=0)slideIdx=k;syncUI()}
  if(a==='slide'){goSlide(+v)}
  if(a==='prev'){goSlide(slideIdx-1)}
  if(a==='next'){goSlide(slideIdx+1)}
  if(a==='addcolor'){$('#colorRows').insertAdjacentHTML('beforeend',colorRow({}))}
  if(a==='rmcolor'){b.closest('.crow').remove()}
  if(a==='addqty'){const p=S.products.find(x=>x.id==v),hasC=(p.colors||[]).length;const n=Math.max(1,Math.floor(+$('#qty').value||1));const key=hasC?v+'|'+detailColor:''+v;const add=Math.min(n,p.stock-inCartTotal(v));if(add>0){cart[key]=(cart[key]||0)+add;toast(p.name+(hasC?' ('+detailColor+')':'')+' added to cart')}else toast('No more stock for '+p.name);render()}
  if(a==='add'){const p=S.products.find(x=>x.id==v);if((cart[v]||0)<p.stock){cart[v]=(cart[v]||0)+1;toast(p.name+' added to cart')}else toast('No more stock for '+p.name);render()}
  if(a==='inc'){const pid=v.split('|')[0],p=S.products.find(x=>x.id==pid);if(p&&inCartTotal(pid)<p.stock)cart[v]++;render()}
  if(a==='dec'){if(--cart[v]<1)delete cart[v];render()}
  if(a==='tab'){tab=v;editId=null;render()}if(a==='newp'){editId=0;render()}if(a==='editp'){editId=+v;render()}if(a==='canceledit'){editId=null;render()}
  if(a==='logout'){adminOK=false;cust=null;try{localStorage.removeItem('cz-cust')}catch(e){}editId=null;go('shop');render()}
  if(a==='delp'&&await ask('Delete this product? This cannot be undone.','Yes, delete','Keep it')){S.products=S.products.filter(p=>p.id!=v);render();await save()}
  if(a==='poster'){cat=v||'All';coll=null;render();const t=document.getElementById('products');if(t)t.scrollIntoView({behavior:'smooth'})}
  if(a==='ordfilter'){ordFilter=v;ordQ='';tab='ord';render()}
  if(a==='restock'){tab='prod';editId=+v;render()}
  if(a==='dup'){const o=S.products.find(x=>x.id==v);if(o){const c=JSON.parse(JSON.stringify(o));c.id=S.nextP++;c.name=o.name+' (copy)';c.hidden=true;S.products.push(c);render();if(await save())toast('Duplicated. The copy is hidden until you show it.')}}
  if(a==='hide'){const o=S.products.find(x=>x.id==v);if(o){o.hidden=!o.hidden;render();if(await save())toast(o.hidden?'Product hidden from the shop':'Product is visible again')}}
  if(a==='msgcust'){const o=S.orders.find(x=>x.id==v);if(o)toast(await copyText('Hello '+o.name+', your order #'+o.id+' is now '+o.status+'. Thank you for shopping with '+cfg().name+'!')?'Message copied. Paste it in WhatsApp to the customer.':'Could not copy the message.')}
  if(a==='delord'&&await ask('Delete this order from the list? This cannot be undone.','Yes, delete','Keep it')){S.orders=S.orders.filter(x=>String(x.id)!==v);render();await save()}
  if(a==='csv'){const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';const rows=[['Order','Date','Name','Phone','Address','Items','Delivery','Total','Status'].map(q).join(',')].concat(S.orders.map(o=>[o.id,new Date(o.created).toISOString(),o.name,o.phone,o.addr,o.items.map(i=>i.name+(i.color?' ('+i.color+')':'')+' x'+i.qty).join('; '),o.delivery||0,o.total,o.status].map(q).join(',')));toast(await copyText(rows.join('\n'))?'Orders copied as CSV. Paste into Excel or Google Sheets.':'Could not copy the orders.')}
  if(a==='copyph'){toast(await copyText(v)?'Phone number copied':'Could not copy')}
  if(a==='copybackup'){toast(await copyText(JSON.stringify(S))?'Backup copied. Paste it somewhere safe.':'Could not copy the backup.')}
  if(a==='resetdemo'&&await ask('Replace ALL products, orders and banners with the demo data? This cannot be undone.','Yes, reset','Keep my data')){const keep={adminEmail:S.adminEmail,adminHash:S.adminHash,wa:S.wa,cfg:S.cfg};S=Object.assign(seed(),keep);editId=null;render();if(await save())toast('Shop reset')}
  if(a==='hprev'){goHero(heroIdx-1)}
  if(a==='hnext'){goHero(heroIdx+1)}
  if(a==='hgo'){goHero(+v)}
  if(a==='hplay'){heroHold=!heroHold;b.textContent=heroHold?'▶':'❚❚';b.setAttribute('aria-label',heroHold?'Play slideshow':'Pause slideshow')}
  if(a==='delban'&&await ask('Delete this banner?','Yes, delete','Keep it')){S.banners=(S.banners||[]).filter(x=>String(x.id)!==v);heroIdx=0;render();await save()}
  if(a==='wabox'){
    const bx=$('#waBox');if(!bx.hidden){bx.hidden=true;return}
    const pr=view()==='product'?S.products.find(x=>x.id===detailId):null;
    bx.innerHTML=waBoxHtml(pr?'Hello '+cfg().name+'! I have a question about: '+pr.name:'Hello '+cfg().name+'! I have a question.');bx.hidden=false;
  }
  if(a==='copynum'){toast(await copyText('+'+waNum())?'Number copied':'Could not copy the number')}
  if(a==='copyorder'){
    const o=(lastOrder&&String(lastOrder.id)===v?lastOrder:null)||S.orders.find(x=>String(x.id)===v)||myOrders().find(x=>String(x.id)===v);
    if(o)toast(await copyText(orderText(o))?'Order message copied. Paste it in WhatsApp.':'Could not copy. Please type your order in WhatsApp.');
  }
  if(a==='trackthis'){const x=S.orders.find(z=>String(z.id)===v)||myOrders().find(z=>String(z.id)===v);if(x){trackQ={id:String(x.id),phone:x.phone};if(view()!=='track')go('track');else render()}}
  if(a==='cancelmine'&&await ask('Cancel this order?','Yes, cancel order','Keep order')){const o=S.orders.find(x=>x.id==v);if(!o)return;await cancelOrder(o);rememberOrder(o);render();await save();toast('Order cancelled')}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{
  const f=e.target.dataset.f; if(!f)return; const id=+e.target.dataset.v;
  if(f==='crange'){chartRange=e.target.value;render();return}
  if(f==='price'||f==='stock'){const p=S.products.find(x=>x.id===id);const n=+e.target.value;if(f==='price'&&n>0)p.price=n;if(f==='stock'&&n>=0)p.stock=Math.floor(n);render();await save();toast('Saved')}
  if(f==='status'){const o=S.orders.find(x=>x.id===id);if(e.target.value==='Cancelled'){if(!await ask('Cancel this order and restock the items?','Yes, cancel order','Keep order')){render();return}await cancelOrder(o)}else o.status=e.target.value;render();await save();toast('Order updated')}
});
document.addEventListener('submit',async e=>{
  e.preventDefault(); const id=e.target.id,f=new FormData(e.target);
  if(id==='checkout'){
    const L=cartLines(); if(!L.length)return;
    const o={id:S.nextO++,created:Date.now(),name:f.get('name').trim(),phone:f.get('phone').trim(),addr:f.get('addr').trim(),notes:(f.get('notes')||'').trim(),status:'Pending',
      items:L.map(l=>({id:l.p.id,name:l.p.name,color:l.c?l.c.name:'',qty:l.qty,price:l.p.price})),delivery:feeFor(subOf(L)),total:subOf(L)+feeFor(subOf(L))};
    L.forEach(l=>l.p.stock-=l.qty); S.orders.unshift(o); cart={}; lastOrder=o; trackQ={id:String(o.id),phone:o.phone}; rememberOrder(o); go('thankyou'); render(); window.scrollTo(0,0); if(await save())toast('Order placed. Thank you!');else toast('Your order is saved on this device, but the shop could not be updated. Please contact the store.');
  }
  if(id==='trackForm'){trackQ={id:String(f.get('id')).replace(/\D/g,''),phone:f.get('phone').trim()};render()}
  if(id==='cfgForm'){
    S.cfg={name:f.get('name').trim()||'CartZen',currency:f.get('currency').trim()||'$',delivery:Math.max(0,+f.get('delivery')||0),freeOver:Math.max(0,+f.get('freeOver')||0),lowStock:Math.max(0,Math.floor(+f.get('lowStock')||0)),notice:f.get('notice').trim(),address:f.get('address').trim(),hours:f.get('hours').trim()};
    render();if(await save())toast('Store details saved');
  }
  if(id==='emailForm'){
    const cur=await sha(f.get('cur')),good=S.adminHash||await sha('Admin@123');
    if(cur!==good){toast('Current password is incorrect');return}
    S.adminEmail=f.get('email').trim().toLowerCase();render();if(await save())toast('Admin email updated');
  }
  if(id==='restoreForm'){
    let o;try{o=JSON.parse(f.get('json'))}catch(err){toast('That is not a valid backup.');return}
    if(!o||!Array.isArray(o.products)||!Array.isArray(o.orders)){toast('That is not a valid backup.');return}
    if(!await ask('Replace all current shop data with this backup?','Yes, restore','Keep current'))return;
    S=Object.assign(seed(),o);editId=null;render();if(await save())toast('Backup restored');
  }
  if(id==='custReg'){
    const name=f.get('name').trim(),phone=f.get('phone').trim(),pw=String(f.get('pw'));
    if(norm(phone).length<10||pw.length<6){msg='Enter a valid phone number and a password of at least 6 characters.';render();return}
    const U=users();
    if(U.some(u=>norm(u.phone)===norm(phone))){msg='That phone number already has an account. Please log in.';render();return}
    const u={id:Date.now(),name,phone,hash:await sha(norm(phone)+':'+pw)};U.push(u);saveUsers(U);
    signIn(u);go('account');render();toast('Welcome, '+name.split(' ')[0]+'!');
  }
  if(id==='custLogin'){
    const phone=f.get('phone').trim(),h=await sha(norm(phone)+':'+f.get('pw')),u=users().find(x=>norm(x.phone)===norm(phone)&&x.hash===h);
    if(!u){msg='Phone number or password is incorrect.';render();return}
    signIn(u);go('account');render();toast('Logged in');
  }
  if(id==='adminForm'){
    const h=await sha(f.get('pw')), good=S.adminHash||await sha('Admin@123');
    if(f.get('email').trim().toLowerCase()===S.adminEmail&&h===good){adminOK=true;msg='';go('admin');render()}
    else{msg='Email or password is incorrect.';render()}
  }
  if(id==='addForm'){S.products.push({id:S.nextP++,name:f.get('name').trim(),cat:f.get('cat').trim(),price:+f.get('price'),stock:Math.floor(+f.get('stock'))});render();await save();toast('Product added')}
  if(id==='prodForm'){
    const btn=$('#saveBtn'),reset=()=>{btn.disabled=false;btn.textContent='Save product'};
    btn.disabled=true;btn.textContent='Saving…';
    const file=f.get('img');let img;
    if(file&&file.size>0){
      if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.size>10000000){toast('Choose a JPG, PNG or WEBP image under 10 MB.');reset();return}
      try{img=await storeImage(file)}catch(err){toast('Could not read that image.');reset();return}
    }
    const colors=[];
    for(const r of document.querySelectorAll('#colorRows .crow')){
      const name=r.querySelector('.cn').value.trim(),fl0=r.querySelector('.cf').files[0];
      if(!name){if(fl0){toast('Type a color name for the photo you chose.');r.querySelector('.cn').focus();reset();return}continue}
      if(colors.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast('Each color needs a different name: '+name);reset();return}
      let cimg=r.querySelector('.ci').value||undefined; const fl=r.querySelector('.cf').files[0];
      if(fl){
        if(!/^image\//.test(fl.type)||fl.size>10000000){toast('Each color image must be a picture under 10 MB.');reset();return}
        try{cimg=await storeImage(fl)}catch(err){toast('Could not read a color image.');reset();return}
      }
      colors.push({name,hex:r.querySelector('.ch').value,...(cimg?{img:cimg}:{})});
    }
    const p=editId===0?{id:S.nextP++}:S.products.find(x=>x.id===editId);
    if(!p){editId=null;render();return}
    p.name=f.get('name').trim();p.desc=(f.get('desc')||'').trim();p.cat=f.get('cat').trim();p.price=+f.get('price');p.stock=Math.max(0,Math.floor(+f.get('stock')));if(colors.length)p.colors=colors;else delete p.colors;p.gift=!!f.get('gift');p.deal=!!f.get('deal');
    if(img!==undefined)p.img=img;else if(f.get('rmimg'))delete p.img;
    if(editId===0)S.products.push(p);
    editId=null;render();if(await save())toast('Product saved');
  }
  if(id==='banForm'){
    const btn=$('#banBtn'),reset=()=>{btn.disabled=false;btn.textContent='Add banner'};
    btn.disabled=true;btn.textContent='Saving…';
    const file=f.get('img');let img;
    if(file&&file.size>0){
      if(!/^image\//.test(file.type)||file.size>10000000){toast('Choose a picture under 10 MB.');reset();return}
      try{img=await storeImage(file,true)}catch(err){toast('Could not read that image.');reset();return}
    }
    (S.banners=S.banners||[]).push({id:Date.now(),title:f.get('title').trim(),sub:(f.get('sub')||'').trim(),cta:(f.get('cta')||'').trim(),...(img?{img}:{}),...(f.get('poster')&&img?{poster:true}:{})});
    heroIdx=0;render();if(await save())toast('Banner added');
  }
  if(id==='waForm'){S.wa=String(f.get('wa')).replace(/\D/g,'');render();if(await save())toast('WhatsApp number saved')}
  if(id==='pwForm'){
    const cur=await sha(f.get('cur')),good=S.adminHash||await sha('Admin@123');
    if(cur!==good){toast('Current password is incorrect');return}
    S.adminHash=await sha(f.get('nw'));await save();e.target.reset();toast('Password updated');
  }
});
addEventListener('hashchange',()=>{msg='';render()});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('cf'))return;
  const f=t.files[0],row=t.closest('.crow');let im=row.querySelector('img.mini');
  if(!f){if(im&&im.dataset.new)im.remove();return}
  if(!im){im=document.createElement('img');im.className='mini';row.insertBefore(im,t)}
  im.dataset.new='1';im.alt='Chosen photo for this color';im.src=URL.createObjectURL(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.thumb[data-a="open"]'))e.target.click()});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.target.closest('#slider')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)goSlide(slideIdx+(dx<0?1:-1))});
document.addEventListener('keydown',e=>{if(view()==='product'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')goSlide(slideIdx+1);if(e.key==='ArrowLeft')goSlide(slideIdx-1)}});

setInterval(()=>{if(view()==='shop'&&!heroPause&&!heroHold&&!document.hidden&&banners().length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)goHero(heroIdx+1)},5000);
document.addEventListener('mouseover',e=>{heroPause=!!e.target.closest('#hs')});
document.addEventListener('focusin',e=>{if(e.target.closest('#hs'))heroPause=true});
document.addEventListener('focusout',e=>{if(e.target.closest('#hs'))heroPause=false});
let hx=null;
document.addEventListener('touchstart',e=>{hx=e.target.closest('#hs')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(hx===null)return;const dx=e.changedTouches[0].clientX-hx;hx=null;if(Math.abs(dx)>40)goHero(heroIdx+(dx<0?1:-1))});

document.addEventListener('input',e=>{
  const id=e.target.id;if(id!=='oq'&&id!=='pq'&&id!=='gq')return;
  if(id==='oq'||id==='gq'){ordQ=e.target.value;if(id==='gq'){tab='ord';ordFilter='All'}}else prodQ=e.target.value;
  const pos=e.target.selectionStart;render();const i=document.getElementById(id);if(i){i.focus();i.setSelectionRange(pos,pos)}
});

/* ---------- Start: local first, then shared storage when available ---------- */
try{const s=localStorage.getItem('eflyer-state');if(s)S=JSON.parse(s)}catch(e){}
render();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use('db'); if(!db)return;
    const doc=db.doc('shop/state');
    doc.onSnapshot(snap=>{
      if(snap.exists){try{S=JSON.parse(snap.data().json)}catch(e){}}
      else doc.set({json:JSON.stringify(S)}).catch(()=>{});
      dbDoc=doc;
      const a=document.activeElement; if(editId===null&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#main').contains(a)))render();
    },()=>{});
  }catch(e){}
})();
</script>
