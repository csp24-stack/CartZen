<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CartZen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
 <link rel="icon" type="image/png" href="./logo.png">
<style>
:root{--bg:#fff;--surface:#fff;--text:#2b2b2b;--muted:#6b6b6b;--line:#e8e8e8;--dark:#2b2b2b;--accent:#f26b21;--thumb:#fbefc7;--ok:#1f8a4c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171717;--surface:#222;--text:#f1f1f1;--muted:#a8a8a8;--line:#363636;--dark:#0f0f0f;--thumb:#3a321a}}
:root[data-theme="dark"]{--bg:#171717;--surface:#222;--text:#f1f1f1;--muted:#a8a8a8;--line:#363636;--dark:#0f0f0f;--thumb:#3a321a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:17px;font-family:Poppins,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{background:var(--dark);color:#fff;display:flex;justify-content:center;gap:20px;padding:12px 14px;font-size:15px;flex-wrap:wrap}
.head{background:#e3ab1c;padding:16px 5vw 22px;text-align:center;color:#fff}
.head.hero{background:linear-gradient(#e3ab1c,#f0c24a 70%,var(--bg));padding-bottom:80px}
.head h1{font-size:clamp(34px,6vw,68px);line-height:1.15;margin:84px 0 28px;text-transform:uppercase}
.logo{font-size:40px;font-weight:700;margin:6px 0 18px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:1300px;margin:0 auto}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);font:inherit;max-width:100%}
.chip,.btn{display:inline-block;border:0;border-radius:4px;padding:12px 20px;background:var(--dark);color:#fff;font-weight:500;text-decoration:none}
.btn.pri{background:var(--accent)}.chip.on{outline:2px solid var(--accent)}.chip.del{background:#c0392b}
button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1380px;margin:0 auto;padding:24px 5vw 50px;min-height:50vh}
main.pull{margin-top:-46px}
h2{font-size:34px}.center{text-align:center}
.filters{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.card{background:var(--surface);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.1);padding:22px;;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.card.left{text-align:left}
.thumb{height:250px;border-radius:4px;display:grid;place-items:center;font-size:64px;background:var(--thumb)}
.price{color:var(--accent);font-size:18px}.muted{color:var(--muted);font-size:15px}
.stack{display:grid;gap:12px;max-width:560px}
.box{max-width:480px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.badge{padding:3px 9px;border-radius:99px;font-size:12px;background:var(--thumb);color:#7a5b00}
.badge.Shipped,.badge.Delivered{background:#d9f0e2;color:var(--ok)}.badge.Cancelled{background:#f6d9d5;color:#a93226}.badge.Processing{background:#dbe8fb;color:#1d4ed8}
.error{color:#c0392b}.empty{text-align:center;color:var(--muted);padding:26px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:22px;border-top:1px solid var(--line)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:44px;align-items:start}.thumb.big{height:480px;font-size:110px}.thumb{overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.mini{width:44px;height:44px;object-fit:contain;border-radius:4px;display:block}.preview{max-width:160px;border-radius:4px}label{display:grid;gap:4px;font-size:14px}label.check{display:flex;align-items:center;gap:8px}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);padding:0}.sw.on{outline:3px solid var(--accent);outline-offset:2px}.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block}.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tb{width:84px;height:84px;padding:0;border:2px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}.tb.on{outline:3px solid var(--accent);outline-offset:2px}.tb img{width:100%;height:100%;object-fit:contain;display:block}
.slider{position:relative;overflow:hidden;border-radius:6px;background:var(--thumb);touch-action:pan-y}.track{display:flex;transition:transform .35s ease}.slide{min-width:100%;height:500px}.slide img{width:100%;height:100%;object-fit:contain;display:block}.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1}.nav.prev{left:8px}.nav.next{right:8px}@media (prefers-reduced-motion:reduce){.track{transition:none}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;list-style:none;padding:0;margin:16px 0;counter-reset:st}
.steps li{counter-increment:st;text-align:center;padding:12px 4px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;font-weight:500}
.steps li::before{content:counter(st);display:block;width:30px;height:30px;line-height:26px;margin:0 auto 6px;border-radius:50%;border:2px solid var(--line);font-weight:600}
.steps li.done{border-color:var(--ok);color:var(--ok)}
.steps li.done::before{content:"\2713";background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.steps li.now::before{content:counter(st);background:#fff;border-color:#fff;color:var(--ok)}
.legend{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:15px;line-height:1.7}
.wa{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#25D366;color:#000;font-weight:600;text-decoration:none;padding:12px 18px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:25}
.wa{border:0}.wabox{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:26;display:grid;gap:8px}.wabox[hidden]{display:none}
.thanks{text-align:center;max-width:720px;margin:0 auto}.thanks .check{width:84px;height:84px;line-height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:46px;margin:10px auto 6px}.wanote{border:2px solid #25D366;border-radius:8px;padding:18px;margin:18px auto;max-width:560px;background:var(--surface)}.thanks .steps{max-width:560px;margin:16px auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40}.modal[hidden]{display:none}.mbox{background:var(--surface);color:var(--text);padding:22px;border-radius:8px;max-width:420px;width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.hs{position:relative;overflow:hidden;border-radius:10px;max-width:1300px;margin:0 auto}
.htrack{display:flex;transition:transform .6s ease}
.hslide{min-width:100%;min-height:340px;padding:40px 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background-size:cover;background-position:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hslide h1{margin:0}.hslide p{font-size:20px;margin:0;max-width:640px}
.hnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:24px;line-height:1;text-shadow:none}
.hprev{left:10px}.hnext{right:10px}.hpl{top:14px;right:10px;transform:none;width:36px;height:36px;font-size:13px}
.hdots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.hdot{width:12px;height:12px;border-radius:50%;border:0;background:rgba(255,255,255,.55);padding:0}.hdot.on{background:#fff;outline:2px solid rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.htrack{transition:none}}
.posters{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin:0 0 40px}
.poster{padding:0;border:0;border-radius:10px;overflow:hidden;background:none;display:block;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:transform .2s}
.poster:hover,.poster:focus-visible{transform:translateY(-4px)}.poster svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.poster{transition:none}}
.hslide{position:relative;overflow:hidden;align-items:flex-start;text-align:left;padding:48px 64px;min-height:380px}
.hslide .hart{position:absolute;right:0;top:0;height:100%;width:58%;pointer-events:none}
.hslide>*:not(.hart){position:relative;z-index:1;max-width:min(560px,100%)}
.hslide h1{font-size:clamp(30px,4.6vw,56px)}
.hslide .chip{background:#fff;color:#2b2b2b;font-weight:600;padding:14px 26px;border-radius:99px}
.hslide.dk{color:#2b2b2b;text-shadow:none}.hslide.dk .chip{background:#2b2b2b;color:#fff}
@media (max-width:700px){.hslide{padding:34px 22px;align-items:center;text-align:center}.hslide .hart{width:100%;opacity:.3}}
.top a,.top button{color:#fff;background:none;border:0;font:inherit;text-decoration:none;padding:4px 10px;border-radius:4px;cursor:pointer}
.top a:hover,.top button:hover{text-decoration:underline}.top .on{background:rgba(255,255,255,.18);font-weight:600}
details{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:var(--surface)}summary{cursor:pointer;font-weight:600}details p{margin:10px 0 0}
.lead{font-size:20px;max-width:760px;line-height:1.6}.about ol{max-width:760px;line-height:1.9;padding-left:22px}
.notice{background:#ffe08a;color:#3b2f00;text-align:center;padding:10px 14px;font-weight:500}.dim{opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
</style>
</head>
<body>
<nav class="top" id="top" aria-label="Quick links"></nav>
<div class="notice" id="notice" hidden></div>
<header class="head" id="head"></header>
<main id="main"></main>
<footer class="foot">© <span id="fname">CartZen</span>. Payment on delivery. <a href="#about">About</a> · <a href="#adminlogin" id="adminLink">Admin login</a></footer>
<button class="wa" id="waBtn" data-a="wabox" hidden>Chat on WhatsApp</button>
<div class="wabox" id="waBox" hidden></div>
<div class="modal" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgMsg"><div class="mbox"><p id="dlgMsg" style="margin-top:0"></p><div class="row" style="justify-content:flex-end"><button class="chip" id="dlgNo">Keep it</button><button class="chip del" id="dlgYes">Yes, continue</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(cfg().currency||'$')+Number(n).toFixed(2);
const STATUSES=['Pending','Processing','Shipped','Delivered','Cancelled'];
const EMO={Men:'👕',Women:'👗',Accessories:'👜'};
const seed=()=>({adminEmail:'admin@eflyer.com',adminHash:null,wa:'',nextP:7,nextO:1001,orders:[],products:[
 {id:1,name:'Men T-shirt',cat:'Men',price:30,stock:24},{id:2,name:'Men shirt',cat:'Men',price:30,stock:18},
 {id:3,name:'Women scarf',cat:'Women',price:30,stock:30},{id:4,name:'Summer dress',cat:'Women',price:48,stock:12},
 {id:5,name:'Leather clutch',cat:'Accessories',price:55,stock:8},{id:6,name:'Gold bracelet',cat:'Accessories',price:22,stock:15}]});
let S=seed(),dbDoc=null,cart={},adminOK=false,tab='dash',cat='All',q='',lastOrder=null,msg='',editId=null,detailId=null,detailColor='',detailMain=true,slideIdx=0,trackQ=null,heroIdx=0,heroHold=false,heroPause=false,coll=null,ordFilter='All',ordQ='',prodQ='';

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('show'),2200)}
async function save(){
  try{ if(dbDoc) await dbDoc.set({json:JSON.stringify(S)}); else localStorage.setItem('eflyer-state',JSON.stringify(S)); }
  catch(e){ toast('Could not save to the shop. If you added photos, try smaller ones.'); return false }
  return true
}
const view=()=>{const h=location.hash.slice(1);return ['shop','cart','track','adminlogin','admin','product','thankyou','help','about','login','register','account'].includes(h)?h:'shop'};
const go=v=>{location.hash=v};

function render(){
  let v=view(); if(v==='admin'&&!adminOK) v='adminlogin';
  const hero=v==='shop';
  const h=$('#head'); h.className='head'+(hero?' hero':'');
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  h.innerHTML=`<div class="logo" onclick="go('shop')">${esc(cfg().name)}</div><nav class="bar">
    <button class="chip ${v==='shop'&&!coll?'on':''}" data-a="coll" data-v="">Shop</button>
    <a class="chip ${v==='cart'?'on':''}" href="#cart">Cart (${n})</a>
    <a class="chip ${v==='track'?'on':''}" href="#track">Track order</a>
    ${adminOK?`<a class="chip ${v==='admin'?'on':''}" href="#admin">Admin panel</a><button class="chip" data-a="logout">Log out</button>`:cust?`<a class="chip ${v==='account'?'on':''}" href="#account">Hi, ${esc(cust.name.split(' ')[0])}</a><button class="chip" data-a="logout">Log out</button>`:`<a class="chip ${v==='login'||v==='register'?'on':''}" href="#login">Customer login</a><a class="chip ${v==='adminlogin'?'on':''}" href="#adminlogin">Admin login</a>`}</nav>
    ${hero?heroHtml():''}`;
  const m=$('#main'); m.className=hero?'pull':'';
  m.innerHTML=({shop:vShop,cart:vCart,track:vTrack,product:vProduct,thankyou:vThanks,help:vHelp,about:vAbout,login:vLogin,register:vRegister,account:vAccount,adminlogin:vAdminLogin,admin:vAdmin})[v]();
  $('#adminLink').hidden=adminOK;
  {const c=cfg();document.title=c.name;const fn=$('#fname');if(fn)fn.textContent=c.name;const nt=$('#notice');nt.hidden=!c.notice;nt.textContent=c.notice}
  $('#top').innerHTML=[['best','Best Sellers'],['gift','Gift Ideas'],['new','New Releases'],['deals','Today’s Deals']].map(([k,t])=>`<button data-a="coll" data-v="${k}" ${v==='shop'&&coll===k?'class="on" aria-current="true"':''}>${t}</button>`).join('')+`<a href="#help" ${v==='help'?'class="on" aria-current="page"':''}>Customer Service</a>`+`<a href="#about" ${v==='about'?'class="on" aria-current="page"':''}>About CartZen</a>`;
  {const wb=$('#waBtn');wb.hidden=!waNum()||adminOK;if(wb.hidden)$('#waBox').hidden=true}
}

/* ---------- Customer panel ---------- */
const cfg=()=>Object.assign({name:'CartZen',currency:'$',delivery:0,freeOver:0,lowStock:5,notice:'',address:'',hours:''},S.cfg||{});
const lowLimit=()=>Math.max(0,+cfg().lowStock||0);
const subOf=L=>L.reduce((t,l)=>t+l.p.price*l.qty,0);
const feeFor=sub=>{const c=cfg();return(+c.delivery>0&&!(+c.freeOver>0&&sub>=+c.freeOver))?+c.delivery:0};
const soldOf=id=>S.orders.filter(o=>o.status!=='Cancelled').reduce((t,o)=>t+o.items.filter(i=>i.id===id).reduce((a,i)=>a+i.qty,0),0);
function vShop(){
  const cats=['All',...new Set(S.products.map(p=>p.cat))];
  const base=S.products.filter(p=>!p.hidden&&(cat==='All'||p.cat===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  let list=base,title='Our Fashion Collection';
  if(coll==='best'){list=[...base].sort((a,b)=>soldOf(b.id)-soldOf(a.id)||a.id-b.id);title='Best Sellers'}
  if(coll==='new'){list=[...base].sort((a,b)=>b.id-a.id).slice(0,8);title='New Releases'}
  if(coll==='gift'){list=base.filter(p=>p.gift);title='Gift Ideas'}
  if(coll==='deals'){list=base.filter(p=>p.deal);title='Today’s Deals'}
  return `<h2 class="center">Featured</h2><div class="posters">${POSTERS.map(posterBtn).join('')}</div>
  <h2 id="products" class="center">${esc(title)}</h2>${coll?`<p class="center"><button class="chip" data-a="coll" data-v="">Show all products</button></p>`:''}
  <div class="filters"><input id="q" type="search" placeholder="Search products" value="${esc(q)}" aria-label="Search products">
  ${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="grid">${list.map(p=>`<div class="card"><div class="thumb" data-a="open" data-v="${p.id}" role="button" tabindex="0" aria-label="View details of ${esc(p.name)}" style="cursor:pointer">${(p.img||((p.colors||[]).find(c=>c.img)||{}).img)?`<img src="${esc(p.img||((p.colors||[]).find(c=>c.img)||{}).img)}" alt="${esc(p.name)}" loading="lazy">`:`<span aria-hidden="true">${EMO[p.cat]||'🛍️'}</span>`}</div><b data-a="open" data-v="${p.id}" style="cursor:pointer">${esc(p.name)}</b>${p.desc?`<div class="muted clamp">${esc(p.desc)}</div>`:''}
   <div class="price"><span class="muted">Price</span> ${money(p.price)}</div><div class="muted">${p.stock>0?p.stock+' in stock':'Sold out'}</div>
   ${(p.colors||[]).length?`<div class="row" style="justify-content:center">${p.colors.slice(0,8).map(c=>`<span class="dot" style="background:${esc(c.hex||'#ccc')}" title="${esc(c.name)}"></span>`).join('')}</div>`:''}<button class="chip" data-a="open" data-v="${p.id}">View details</button><button class="btn pri" data-a="${(p.colors||[]).length?'open':'add'}" data-v="${p.id}" ${p.stock<1?'disabled':''}>${(p.colors||[]).length?'Choose color':'Add to cart'}</button></div>`).join('')}</div>
  ${list.length?'':`<p class="empty">${coll==='gift'?'No gift ideas picked yet. Check back soon.':coll==='deals'?'No deals today. Check back soon.':'No products match your search.'}</p>`}`;
}
// Shop WhatsApp number: set it under Admin > Settings, or type it here as a default for every visitor, e.g. '8801712345678'
const WA_FIXED='8801850692597';
const normWa=d=>{d=String(d||'').replace(/\D/g,'');if(/^0\d{10}$/.test(d))return '880'+d.slice(1);if(/^1\d{9}$/.test(d))return '880'+d;return d};
const waNum=()=>normWa(S.wa||WA_FIXED);
const waLink=t=>'https://wa.me/'+waNum()+'?text='+encodeURIComponent(t);
const orderText=o=>['New order #'+o.id+' - '+cfg().name,'Name: '+o.name,'Phone: '+o.phone,'Address: '+o.addr,'Items:',...o.items.map(i=>'- '+i.name+(i.color?' ('+i.color+')':'')+' x'+i.qty+' = '+money(i.price*i.qty)),'Total: '+money(o.total)+(o.delivery?' (incl. '+money(o.delivery)+' delivery)':'')+' (cash on delivery)',...(o.notes?['Notes: '+o.notes]:[])].join('\n');
const waBoxHtml=t=>`<b>Chat with us on WhatsApp</b><div class="muted">Our number: +${esc(waNum())}</div>
<a class="btn" style="background:#25D366;color:#000;text-align:center" href="${esc(waLink(t))}" target="_blank" rel="noopener">Open WhatsApp</a>

<button class="chip" data-a="copynum">Copy number</button>
<p class="muted" style="margin:0">If a link shows “blocked”, copy the number and message us in WhatsApp directly.</p>`;
function ask(msg,yes,no){
  return new Promise(res=>{
    const d=$('#dlg'),Y=$('#dlgYes'),N=$('#dlgNo');
    $('#dlgMsg').textContent=msg;Y.textContent=yes||'Yes, continue';N.textContent=no||'Keep it';d.hidden=false;N.focus();
    const done=v=>{d.hidden=true;Y.onclick=null;N.onclick=null;res(v)};
    Y.onclick=()=>done(true);N.onclick=()=>done(false);
  });
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}
const inCartTotal=id=>Object.entries(cart).filter(([k])=>k.split('|')[0]==id).reduce((t,[,n])=>t+n,0);
function cartLines(){
  const L=[],used={};
  for(const [k,qty] of Object.entries(cart)){
    const [id,color]=k.split('|'),p=S.products.find(x=>x.id==id); if(!p)continue;
    const c=color?(p.colors||[]).find(x=>x.name===color):null; if(color&&!c)continue;
    const q=Math.min(qty,p.stock-(used[p.id]||0)); if(q<1)continue;
    used[p.id]=(used[p.id]||0)+q; L.push({key:k,p,c,qty:q});
  }
  return L;
}

function shrink(file,max,qual){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',qual)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
const blobToUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function storeImage(file,big){
  let assets=null; try{assets=window.claude&&claude.use?await claude.use('assets'):null}catch(e){}
  if(assets){try{const b=await shrink(file,big?1400:800,.8);const r=await Promise.race([assets.upload(b),new Promise((_,rej)=>setTimeout(rej,12000))]);return r.url}catch(e){}}
  return blobToUrl(await shrink(file,big?640:320,.6));   // fallback: small image kept inside the shop data
}

  if(a==='rmcolor'){b.closest('.crow').remove()}
  if(a==='addqty'){const p=S.products.find(x=>x.id==v),hasC=(p.colors||[]).length;const n=Math.max(1,Math.floor(+$('#qty').value||1));const key=hasC?v+'|'+detailColor:''+v;const add=Math.min(n,p.stock-inCartTotal(v));if(add>0){cart[key]=(cart[key]||0)+add;toast(p.name+(hasC?' ('+detailColor+')':'')+' added to cart')}else toast('No more stock for '+p.name);render()}
  if(a==='add'){const p=S.products.find(x=>x.id==v);if((cart[v]||0)<p.stock){cart[v]=(cart[v]||0)+1;toast(p.name+' added to cart')}else toast('No more stock for '+p.name);render()}
  if(a==='inc'){const pid=v.split('|')[0],p=S.products.find(x=>x.id==pid);if(p&&inCartTotal(pid)<p.stock)cart[v]++;render()}
  if(a==='dec'){if(--cart[v]<1)delete cart[v];render()}
  if(a==='tab'){tab=v;editId=null;render()}if(a==='newp'){editId=0;render()}if(a==='editp'){editId=+v;render()}if(a==='canceledit'){editId=null;render()}
  if(a==='logout'){adminOK=false;cust=null;try{localStorage.removeItem('cz-cust')}catch(e){}editId=null;go('shop');render()}
  if(a==='delp'&&await ask('Delete this product? This cannot be undone.','Yes, delete','Keep it')){S.products=S.products.filter(p=>p.id!=v);render();await save()}
  if(a==='poster'){cat=v||'All';coll=null;render();const t=document.getElementById('products');if(t)t.scrollIntoView({behavior:'smooth'})}
  if(a==='ordfilter'){ordFilter=v;ordQ='';tab='ord';render()}
  if(a==='restock'){tab='prod';editId=+v;render()}
  if(a==='dup'){const o=S.products.find(x=>x.id==v);if(o){const c=JSON.parse(JSON.stringify(o));c.id=S.nextP++;c.name=o.name+' (copy)';c.hidden=true;S.products.push(c);render();if(await save())toast('Duplicated. The copy is hidden until you show it.')}}
  if(a==='hide'){const o=S.products.find(x=>x.id==v);if(o){o.hidden=!o.hidden;render();if(await save())toast(o.hidden?'Product hidden from the shop':'Product is visible again')}}
  if(a==='msgcust'){const o=S.orders.find(x=>x.id==v);if(o)toast(await copyText('Hello '+o.name+', your order #'+o.id+' is now '+o.status+'. Thank you for shopping with '+cfg().name+'!')?'Message copied. Paste it in WhatsApp to the customer.':'Could not copy the message.')}
  if(a==='delord'&&await ask('Delete this order from the list? This cannot be undone.','Yes, delete','Keep it')){S.orders=S.orders.filter(x=>String(x.id)!==v);render();await save()}
  if(a==='csv'){const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';const rows=[['Order','Date','Name','Phone','Address','Items','Delivery','Total','Status'].map(q).join(',')].concat(S.orders.map(o=>[o.id,new Date(o.created).toISOString(),o.name,o.phone,o.addr,o.items.map(i=>i.name+(i.color?' ('+i.color+')':'')+' x'+i.qty).join('; '),o.delivery||0,o.total,o.status].map(q).join(',')));toast(await copyText(rows.join('\n'))?'Orders copied as CSV. Paste into Excel or Google Sheets.':'Could not copy the orders.')}
  if(a==='copyph'){toast(await copyText(v)?'Phone number copied':'Could not copy')}
  if(a==='copybackup'){toast(await copyText(JSON.stringify(S))?'Backup copied. Paste it somewhere safe.':'Could not copy the backup.')}
  if(a==='resetdemo'&&await ask('Replace ALL products, orders and banners with the demo data? This cannot be undone.','Yes, reset','Keep my data')){const keep={adminEmail:S.adminEmail,adminHash:S.adminHash,wa:S.wa,cfg:S.cfg};S=Object.assign(seed(),keep);editId=null;render();if(await save())toast('Shop reset')}
  if(a==='hprev'){goHero(heroIdx-1)}
  if(a==='hnext'){goHero(heroIdx+1)}
  if(a==='hgo'){goHero(+v)}
  if(a==='hplay'){heroHold=!heroHold;b.textContent=heroHold?'▶':'❚❚';b.setAttribute('aria-label',heroHold?'Play slideshow':'Pause slideshow')}
  if(a==='delban'&&await ask('Delete this banner?','Yes, delete','Keep it')){S.banners=(S.banners||[]).filter(x=>String(x.id)!==v);heroIdx=0;render();await save()}
  if(a==='wabox'){
    const bx=$('#waBox');if(!bx.hidden){bx.hidden=true;return}
    const pr=view()==='product'?S.products.find(x=>x.id===detailId):null;
    bx.innerHTML=waBoxHtml(pr?'Hello '+cfg().name+'! I have a question about: '+pr.name:'Hello '+cfg().name+'! I have a question.');bx.hidden=false;
  }
  if(a==='copynum'){toast(await copyText('+'+waNum())?'Number copied':'Could not copy the number')}
  if(a==='copyorder'){
    const o=(lastOrder&&String(lastOrder.id)===v?lastOrder:null)||S.orders.find(x=>String(x.id)===v)||myOrders().find(x=>String(x.id)===v);
    if(o)toast(await copyText(orderText(o))?'Order message copied. Paste it in WhatsApp.':'Could not copy. Please type your order in WhatsApp.');
  }
  if(a==='trackthis'){const x=S.orders.find(z=>String(z.id)===v)||myOrders().find(z=>String(z.id)===v);if(x){trackQ={id:String(x.id),phone:x.phone};if(view()!=='track')go('track');else render()}}
  if(a==='cancelmine'&&await ask('Cancel this order?','Yes, cancel order','Keep order')){const o=S.orders.find(x=>x.id==v);if(!o)return;await cancelOrder(o);rememberOrder(o);render();await save();toast('Order cancelled')}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{
  const f=e.target.dataset.f; if(!f)return; const id=+e.target.dataset.v;
  if(f==='price'||f==='stock'){const p=S.products.find(x=>x.id===id);const n=+e.target.value;if(f==='price'&&n>0)p.price=n;if(f==='stock'&&n>=0)p.stock=Math.floor(n);render();await save();toast('Saved')}
  if(f==='status'){const o=S.orders.find(x=>x.id===id);if(e.target.value==='Cancelled'){if(!await ask('Cancel this order and restock the items?','Yes, cancel order','Keep order')){render();return}await cancelOrder(o)}else o.status=e.target.value;render();await save();toast('Order updated')}
});
document.addEventListener('submit',async e=>{
  e.preventDefault(); const id=e.target.id,f=new FormData(e.target);
  if(id==='checkout'){
    const L=cartLines(); if(!L.length)return;
    const o={id:S.nextO++,created:Date.now(),name:f.get('name').trim(),phone:f.get('phone').trim(),addr:f.get('addr').trim(),notes:(f.get('notes')||'').trim(),status:'Pending',
      items:L.map(l=>({id:l.p.id,name:l.p.name,color:l.c?l.c.name:'',qty:l.qty,price:l.p.price})),delivery:feeFor(subOf(L)),total:subOf(L)+feeFor(subOf(L))};
    L.forEach(l=>l.p.stock-=l.qty); S.orders.unshift(o); cart={}; lastOrder=o; trackQ={id:String(o.id),phone:o.phone}; rememberOrder(o); go('thankyou'); render(); window.scrollTo(0,0); if(await save())toast('Order placed. Thank you!');else toast('Your order is saved on this device, but the shop could not be updated. Please contact the store.');
  }
  if(id==='trackForm'){trackQ={id:String(f.get('id')).replace(/\D/g,''),phone:f.get('phone').trim()};render()}
  if(id==='cfgForm'){
    S.cfg={name:f.get('name').trim()||'CartZen',currency:f.get('currency').trim()||'$',delivery:Math.max(0,+f.get('delivery')||0),freeOver:Math.max(0,+f.get('freeOver')||0),lowStock:Math.max(0,Math.floor(+f.get('lowStock')||0)),notice:f.get('notice').trim(),address:f.get('address').trim(),hours:f.get('hours').trim()};
    render();if(await save())toast('Store details saved');
  }
  if(id==='emailForm'){
    const cur=await sha(f.get('cur')),good=S.adminHash||await sha('Admin@123');
    if(cur!==good){toast('Current password is incorrect');return}
    S.adminEmail=f.get('email').trim().toLowerCase();render();if(await save())toast('Admin email updated');
  }
  if(id==='restoreForm'){
    let o;try{o=JSON.parse(f.get('json'))}catch(err){toast('That is not a valid backup.');return}
    if(!o||!Array.isArray(o.products)||!Array.isArray(o.orders)){toast('That is not a valid backup.');return}
    if(!await ask('Replace all current shop data with this backup?','Yes, restore','Keep current'))return;
    S=Object.assign(seed(),o);editId=null;render();if(await save())toast('Backup restored');
  }
  if(id==='custReg'){
    const name=f.get('name').trim(),phone=f.get('phone').trim(),pw=String(f.get('pw'));
    if(norm(phone).length<10||pw.length<6){msg='Enter a valid phone number and a password of at least 6 characters.';render();return}
    const U=users();
    if(U.some(u=>norm(u.phone)===norm(phone))){msg='That phone number already has an account. Please log in.';render();return}
    const u={id:Date.now(),name,phone,hash:await sha(norm(phone)+':'+pw)};U.push(u);saveUsers(U);
    signIn(u);go('account');render();toast('Welcome, '+name.split(' ')[0]+'!');
  }
  if(id==='custLogin'){
    const phone=f.get('phone').trim(),h=await sha(norm(phone)+':'+f.get('pw')),u=users().find(x=>norm(x.phone)===norm(phone)&&x.hash===h);
    if(!u){msg='Phone number or password is incorrect.';render();return}
    signIn(u);go('account');render();toast('Logged in');
  }
  if(id==='adminForm'){
    const h=await sha(f.get('pw')), good=S.adminHash||await sha('Admin@123');
    if(f.get('email').trim().toLowerCase()===S.adminEmail&&h===good){adminOK=true;msg='';go('admin');render()}
    else{msg='Email or password is incorrect.';render()}
  }
  if(id==='addForm'){S.products.push({id:S.nextP++,name:f.get('name').trim(),cat:f.get('cat').trim(),price:+f.get('price'),stock:Math.floor(+f.get('stock'))});render();await save();toast('Product added')}
  if(id==='prodForm'){
    const btn=$('#saveBtn'),reset=()=>{btn.disabled=false;btn.textContent='Save product'};
    btn.disabled=true;btn.textContent='Saving…';
    const file=f.get('img');let img;
    if(file&&file.size>0){
      if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.size>10000000){toast('Choose a JPG, PNG or WEBP image under 10 MB.');reset();return}
      try{img=await storeImage(file)}catch(err){toast('Could not read that image.');reset();return}
    }
    const colors=[];
    for(const r of document.querySelectorAll('#colorRows .crow')){
      const name=r.querySelector('.cn').value.trim(),fl0=r.querySelector('.cf').files[0];
      if(!name){if(fl0){toast('Type a color name for the photo you chose.');r.querySelector('.cn').focus();reset();return}continue}
      if(colors.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast('Each color needs a different name: '+name);reset();return}
      let cimg=r.querySelector('.ci').value||undefined; const fl=r.querySelector('.cf').files[0];
      if(fl){
        if(!/^image\//.test(fl.type)||fl.size>10000000){toast('Each color image must be a picture under 10 MB.');reset();return}
        try{cimg=await storeImage(fl)}catch(err){toast('Could not read a color image.');reset();return}
      }
      colors.push({name,hex:r.querySelector('.ch').value,...(cimg?{img:cimg}:{})});
    }
    const p=editId===0?{id:S.nextP++}:S.products.find(x=>x.id===editId);
    if(!p){editId=null;render();return}
    p.name=f.get('name').trim();p.desc=(f.get('desc')||'').trim();p.cat=f.get('cat').trim();p.price=+f.get('price');p.stock=Math.max(0,Math.floor(+f.get('stock')));if(colors.length)p.colors=colors;else delete p.colors;p.gift=!!f.get('gift');p.deal=!!f.get('deal');
    if(img!==undefined)p.img=img;else if(f.get('rmimg'))delete p.img;
    if(editId===0)S.products.push(p);
    editId=null;render();if(await save())toast('Product saved');
  }
  if(id==='banForm'){
    const btn=$('#banBtn'),reset=()=>{btn.disabled=false;btn.textContent='Add banner'};
    btn.disabled=true;btn.textContent='Saving…';
    const file=f.get('img');let img;
    if(file&&file.size>0){
      if(!/^image\//.test(file.type)||file.size>10000000){toast('Choose a picture under 10 MB.');reset();return}
      try{img=await storeImage(file,true)}catch(err){toast('Could not read that image.');reset();return}
    }
    (S.banners=S.banners||[]).push({id:Date.now(),title:f.get('title').trim(),sub:(f.get('sub')||'').trim(),cta:(f.get('cta')||'').trim(),...(img?{img}:{})});
    heroIdx=0;render();if(await save())toast('Banner added');
  }
  if(id==='waForm'){S.wa=String(f.get('wa')).replace(/\D/g,'');render();if(await save())toast('WhatsApp number saved')}
  if(id==='pwForm'){
    const cur=await sha(f.get('cur')),good=S.adminHash||await sha('Admin@123');
    if(cur!==good){toast('Current password is incorrect');return}
    S.adminHash=await sha(f.get('nw'));await save();e.target.reset();toast('Password updated');
  }
});
addEventListener('hashchange',()=>{msg='';render()});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('cf'))return;
  const f=t.files[0],row=t.closest('.crow');let im=row.querySelector('img.mini');
  if(!f){if(im&&im.dataset.new)im.remove();return}
  if(!im){im=document.createElement('img');im.className='mini';row.insertBefore(im,t)}
  im.dataset.new='1';im.alt='Chosen photo for this color';im.src=URL.createObjectURL(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.thumb[data-a="open"]'))e.target.click()});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.target.closest('#slider')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)goSlide(slideIdx+(dx<0?1:-1))});
document.addEventListener('keydown',e=>{if(view()==='product'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')goSlide(slideIdx+1);if(e.key==='ArrowLeft')goSlide(slideIdx-1)}});

setInterval(()=>{if(view()==='shop'&&!heroPause&&!heroHold&&!document.hidden&&banners().length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)goHero(heroIdx+1)},5000);
document.addEventListener('mouseover',e=>{heroPause=!!e.target.closest('#hs')});
document.addEventListener('focusin',e=>{if(e.target.closest('#hs'))heroPause=true});
document.addEventListener('focusout',e=>{if(e.target.closest('#hs'))heroPause=false});
let hx=null;
document.addEventListener('touchstart',e=>{hx=e.target.closest('#hs')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(hx===null)return;const dx=e.changedTouches[0].clientX-hx;hx=null;if(Math.abs(dx)>40)goHero(heroIdx+(dx<0?1:-1))});

document.addEventListener('input',e=>{
  const id=e.target.id;if(id!=='oq'&&id!=='pq')return;
  if(id==='oq')ordQ=e.target.value;else prodQ=e.target.value;
  const pos=e.target.selectionStart;render();const i=document.getElementById(id);if(i){i.focus();i.setSelectionRange(pos,pos)}
});

/* ---------- Start: local first, then shared storage when available ---------- */
try{const s=localStorage.getItem('eflyer-state');if(s)S=JSON.parse(s)}catch(e){}
render();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use('db'); if(!db)return;
    const doc=db.doc('shop/state');
    doc.onSnapshot(snap=>{
      if(snap.exists){try{S=JSON.parse(snap.data().json)}catch(e){}}
      else doc.set({json:JSON.stringify(S)}).catch(()=>{});
      dbDoc=doc;
      const a=document.activeElement; if(editId===null&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#main').contains(a)))render();
    },()=>{});
  }catch(e){}
})();
</script>
</body>
